[project]
name = "delta-chat"
version = "0.1.0"
description = "Compare two document revisions and chat with the delta, grounded with citations."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.115.0",
    "groq>=1.6.0",
    "langchain-chroma>=1.1.0",
    "langchain-huggingface>=1.2.2",
    "pillow>=12.3.0",
    "pydantic>=2.13.4",
    "pymupdf>=1.28.0",
    "pytesseract>=0.3.13",
    "python-dotenv>=1.2.2",
    "python-json-logger>=4.1.0",
    "pyyaml>=6.0.2",
    "rapidfuzz>=3.14.5",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=5.6.1",
    "uvicorn>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.9.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.format]
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src", "eval", "main"]

[tool.coverage.report]
show_missing = true
skip_covered = true
