name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install system dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr

      - name: Install uv
        run: python -m pip install uv

      - name: Sync locked environment
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check src tests eval main.py data/samples/make_samples.py

      - name: Check formatting
        run: uv run ruff format --check src tests eval main.py data/samples/make_samples.py

      - name: Test
        run: uv run pytest -q
