app:
  name: "Delta Chat"
  version: "1.0.0"

# LLM used only for the final grounded-chat answer.
llm:
  provider: "groq"
  model: "llama-3.1-8b-instant"
  temperature: 0.0
  max_tokens: 2048
  input_cost_per_million_tokens_usd: 0.05
  output_cost_per_million_tokens_usd: 0.08

# Local embedding model used to build the Chroma retrieval index.
embedding:
  model: "sentence-transformers/all-MiniLM-L6-v2"
  device: "cpu"

chroma:
  collection_name: "delta_chat"
  persist_directory: "data/chroma_db"

retrieval:
  top_k: 5

# A PDF with at least this many selectable characters is treated as native;
# otherwise it is routed to the Tesseract OCR adapter.
ingest:
  native_text_threshold: 30
  ocr_dpi: 200

paths:
  revision_a: "data/samples/synthetic_revision/revision_a.pdf"
  revision_b: "data/samples/synthetic_revision/revision_b.pdf"

  canonical_a: "data/output/revision_a.json"
  canonical_b: "data/output/revision_b.json"

  delta_json: "data/reports/delta_report.json"
  delta_markdown: "data/reports/delta_report.md"

# How aggressively matched elements are aligned between revisions.
align:
  similarity_threshold: 80.0
  max_bbox_distance: 75.0
